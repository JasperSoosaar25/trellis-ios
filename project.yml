name: Trellis
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ''
packages:
  GitHubKit:
    path: Packages/GitHubKit
  Textual:
    url: https://github.com/gonzalezreal/textual.git
    exactVersion: 0.5.0
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    exactVersion: 0.11.0
targets:
  Trellis:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: GitHubKit
      - package: Textual
      - package: Sodium
        product: Sodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.trellis.client
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GH_CLIENT_ID: ''
  TrellisTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Trellis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.trellis.client.tests
        GENERATE_INFOPLIST_FILE: YES
  TrellisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: Trellis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.trellis.client.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Trellis:
    build:
      targets:
        Trellis: all
        TrellisTests: [test]
        TrellisUITests: [test]
    test:
      targets: [TrellisTests, TrellisUITests]
      gatherCoverageData: true
